<title>Countable Cove</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one tropical-sea world — a sea-map hero, island cards on sand, and a sticker-bordered quiz card per island. Single daylight look by choice. */
:root{
  --sky:#C9F1FF; --sea:#1590B5; --deep:#0B5C7E; --sand:#F8E8BE; --sand2:#EBCB8B;
  --leaf:#2E9E5B; --coral:#FF6F59; --sun:#FFC93C; --ink:#173A50; --muted:#4E6B7E;
  --card:#FFFCF4; --line:#E6D4A8; --ok:#1E9E5A; --okbg:#DDF6E7; --bad:#D94141; --badbg:#FFE1DC;
  --f-disp:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --ac:#2E9E5B; --ac2:#DDF3E5;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--sky)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:17px;line-height:1.5;
  background:linear-gradient(180deg,var(--sky) 0,#E7F8FF 340px,var(--sand) 760px,var(--sand) 100%);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:12px}
.en{font-family:var(--f-disp);font-weight:600;color:var(--deep)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px}
.top .polly{width:74px;flex:none;animation:bob 3s ease-in-out infinite}
.top h1{font-size:clamp(30px,7vw,46px);font-weight:700;color:var(--deep);letter-spacing:.5px}
.top h1 span{color:var(--coral)}
.top p{margin:2px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.hud{margin-left:auto;display:grid;grid-template-columns:auto auto;column-gap:8px;align-items:baseline;row-gap:0;font-family:var(--f-disp);font-weight:600}
.hud b{font-size:22px;color:#B97A00}
.hud small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
@media (max-width:520px){.top{flex-wrap:wrap}.top .polly{width:58px}.hud{margin-left:0;width:100%;justify-items:start}}

/* ---------- map ---------- */
.mapbox{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(90,60,20,.3),inset 0 0 0 4px rgba(122,74,34,.4);background:#E2C389}
.mapbox svg{display:block;width:100%;height:auto}
.isl{cursor:pointer}
.isl .ib{transition:transform .25s}
.isl:hover .ib,.isl:focus-visible .ib{transform:translateY(-6px)}
.isl:focus-visible{outline:none}
.isl:focus-visible .ring{stroke:#fff;stroke-width:4}
.mlab{font-family:var(--f-disp);font-weight:700;font-size:21px;fill:#5E3A1E}
.wave{animation:wave 6s linear infinite}
.cloud{animation:drift 40s linear infinite}
.boat{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wave{to{transform:translateX(-80px)}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(760px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.scene{position:relative;border-radius:24px;overflow:hidden;height:clamp(130px,26vw,180px);box-shadow:0 8px 20px rgba(0,0,0,.2),inset 0 0 0 3px rgba(255,255,255,.35)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene-t{position:absolute;left:16px;bottom:12px;color:#fff;display:flex;flex-direction:column;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.35)}
.scene-t small{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
.scene-t b{font-family:var(--f-disp);font-weight:700;font-size:clamp(28px,7vw,42px);line-height:1}
.scene-t span{font-weight:800;font-size:15px}
.fall{animation:fall .7s linear infinite}@keyframes fall{to{stroke-dashoffset:-24}}
.fly{animation:fly 2.4s ease-in-out infinite alternate}@keyframes fly{from{opacity:.25}to{opacity:1}}
.floaty{animation:floaty 3s ease-in-out infinite}@keyframes floaty{50%{translate:0 -8px}}
.flame{animation:flame .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes flame{to{transform:scaleY(.82) scaleX(1.1)}}
.swing{animation:floaty 2.6s ease-in-out infinite}
.pulse{animation:fly 1.2s ease-in-out infinite alternate}
.glow{animation:fly 1.4s ease-in-out infinite alternate}
.tip.win{background:#FFF3C4}
.icard .stg{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.hud .pc{color:#B3362B}
.bub .en{font-size:18px}
.bub .tr{font-style:italic}
.fb .sm{display:block;font-weight:700;color:var(--muted);font-size:14px}
.fb .ansl{margin:8px 0 2px;font-size:18px}.fb .ansl .en{font-size:22px}
.fb .note{margin:0 0 8px;font-weight:700;font-size:15px;color:var(--muted)}
.reward{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;background:#FFF3C4;border-radius:20px;padding:12px 16px;text-align:left}
.reward .en{font-size:20px}.reward .sm{display:block;font-weight:700;color:var(--muted);font-size:14px}
.rule{background:var(--ac2);border-radius:18px;padding:12px 16px;border:2px dashed var(--ac)}
.rule .en{font-size:19px;display:block}.rule .sm{display:block;font-weight:700;color:var(--muted);font-size:15px;margin-top:2px}
.bin{flex:1 1 92px;min-width:0;display:flex;flex-direction:column;gap:6px}
.binh{background:var(--ac);color:#fff;border-radius:14px;padding:6px 8px;text-align:center;display:flex;flex-direction:column;line-height:1.15}
.binh b{font-family:var(--f-disp);font-size:clamp(15px,4.4vw,20px);overflow-wrap:anywhere}.binh small{font-weight:700;font-size:12px;opacity:.95}
.slot.binz{width:100%;min-height:150px;align-content:flex-start;background:#fff}
.tok.lab{flex-direction:column;background:#fff;border-radius:14px;padding:4px 6px 3px;box-shadow:0 3px 0 #D8C79F;font-family:var(--f-disp);font-weight:600;font-size:14px;gap:0}
.tok.lab svg{width:42px;height:42px}
.tok.pic.lab.ok,.tok.pic.lab.bad{border-radius:14px}
.slot.mat{width:min(320px,100%);min-height:140px;border-radius:16px;background:repeating-conic-gradient(#E5484D 0 25%,#fff 0 50%) 0 0/36px 36px;border:4px solid #B8283D}
.mat .tok.pic svg{width:46px;height:46px}
.mcol .tok.chip{white-space:normal;text-align:center;line-height:1.1}
.lc b{font-size:clamp(17px,4.6vw,22px)!important;text-align:center;line-height:1.15}
.opt.w{font-size:clamp(16px,4.6vw,24px)!important;line-height:1.15;padding:10px 8px}
.tip{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.tip svg{flex:none}

/* ---------- island list ---------- */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.icard{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:22px;padding:12px 14px;background:var(--card);
  box-shadow:0 4px 0 var(--line),0 8px 18px rgba(120,90,30,.12);border-left:8px solid var(--c);transition:transform .15s}
.icard:hover{transform:translateY(-3px)}
.icard .pic{width:64px;height:64px;flex:none;border-radius:18px;background:var(--cb);display:grid;place-items:center}
.icard h3{font-size:21px;color:var(--ink)}
.icard .sub{font-size:14px;color:var(--muted);font-weight:700}
.stars{display:flex;gap:2px;margin-top:3px}
.stars svg{width:20px;height:20px}

/* ---------- sticker book ---------- */
.book{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--line)}
.book h2{font-size:24px;color:var(--deep);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.book h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:12px}
.st{border:0;background:#fff;border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--line);font-family:var(--f-disp);font-weight:600;font-size:15px}
.st svg{filter:drop-shadow(0 0 0 #fff) drop-shadow(1px 1px 0 #fff) drop-shadow(-1px -1px 0 #fff) drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.st.lock{background:#F1E6CC;color:#B7A47C}
.st.lock svg{filter:grayscale(1) brightness(1.45) opacity(.45)}

/* ---------- island view ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.bar h2{font-size:clamp(22px,5vw,30px);color:var(--ink)}
.bar h2 small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.phase{margin-left:auto;display:flex;gap:6px;font-size:13px;font-weight:800}
.phase span{padding:5px 10px;border-radius:999px;background:#fff;color:var(--muted)}
.phase span.on{background:var(--ac);color:#fff}
@media (max-width:520px){.phase{margin-left:0;width:100%}}

.card{position:relative;background:var(--card);border-radius:28px;padding:18px;box-shadow:0 5px 0 var(--line),0 14px 30px rgba(120,90,30,.15);border-top:10px solid var(--ac);display:flex;flex-direction:column;gap:14px;overflow:clip}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-disp);font-weight:600;background:var(--ac);color:#fff;border-radius:999px;padding:3px 12px;font-size:15px}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#E8DCC0}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--coral)}.dots i.cur{background:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.qtype{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.say{display:flex;gap:12px;align-items:flex-start}
.say .polly{width:60px;flex:none}
.bub{position:relative;background:#fff;border-radius:18px;padding:10px 14px;font-weight:700;box-shadow:0 2px 0 var(--line);flex:1;min-width:0}
.bub:before{content:"";position:absolute;left:-9px;top:18px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bub .sm{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}

.spk{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;background:var(--deep);color:#fff;font-family:var(--f-disp);font-weight:600;font-size:18px;box-shadow:0 4px 0 #063E57}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #063E57}
.spk.slow{background:#fff;color:var(--deep);box-shadow:0 4px 0 var(--line);font-size:15px;padding:8px 14px}
.spk.mini{padding:4px 9px;font-size:14px;background:var(--ac2);color:var(--ink);box-shadow:none}
.spk.mini svg{width:16px;height:16px}
.spk.playing{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
.listen{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.reveal{border:0;background:none;text-decoration:underline;color:var(--muted);font-weight:800;font-size:14px}
.word-shown{font-family:var(--f-disp);font-size:24px;font-weight:600;color:var(--deep);text-align:center}

.stage{background:radial-gradient(120% 90% at 50% 0,#FFFFFF 0,#FFF6DE 70%);border-radius:22px;padding:14px;border:2px dashed var(--line)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:0;background:#fff;border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--line),0 6px 14px rgba(0,0,0,.06);transition:transform .15s;min-height:96px;justify-content:center}
.opt:hover{transform:translateY(-3px)}
.opt svg{width:min(88px,100%);height:auto}
.opt.w{font-family:var(--f-disp);font-weight:600;font-size:clamp(19px,5vw,26px);color:var(--ink)}
.opt.ok{background:var(--okbg);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--badbg);box-shadow:0 4px 0 var(--bad);opacity:.6;animation:shake .4s}
.opt[disabled]{cursor:default}
.bigpic{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.bigpic svg{width:min(140px,40vw);height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.bigpic.row svg{width:min(70px,18vw)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- drag & drop ---------- */
.board{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:flex-end}
.slot{position:relative;min-width:62px;min-height:54px;border-radius:14px;background:rgba(23,58,80,.06);box-shadow:inset 0 2px 4px rgba(0,0,0,.12);border:2px dashed #C9B68B;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:4px;transition:background .15s,border-color .15s}
.slot.hov,.selmode .slot:hover{background:var(--ac2);border-color:var(--ac)}
.slot.l{width:54px;min-width:54px;height:62px}
.slot.w{min-width:76px}
.tray{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;border-radius:18px;background:linear-gradient(#C98E55,#A86B35);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 0 #7A4A22;min-height:72px;position:relative}
.tray:empty:after,.tray .hint{content:"";color:#FCE9CB;font-weight:800;font-size:14px;align-self:center}
.tok{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:transform .12s;position:relative}
.tok.chip{background:#fff;padding:8px 14px;font-family:var(--f-disp);font-weight:600;font-size:21px;color:var(--ink);box-shadow:0 4px 0 #D8C79F}
.tok.tile{width:46px;height:52px;background:linear-gradient(#FFF7E2,#F3DEAE);font-family:var(--f-disp);font-weight:700;font-size:28px;color:#5A3A18;box-shadow:0 4px 0 #B98D52;border-radius:10px}
.tok.pic{padding:2px}
.tok.pic svg{width:54px;height:54px;filter:drop-shadow(1px 1px 0 #fff) drop-shadow(-1px -1px 0 #fff) drop-shadow(1px -1px 0 #fff) drop-shadow(-1px 1px 0 #fff) drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.tok.paint{flex-direction:column;background:#fff;border-radius:16px;padding:4px 8px 6px;box-shadow:0 4px 0 #D8C79F;font-family:var(--f-disp);font-weight:600;font-size:16px}
.tok.paint svg{width:38px;height:38px}
.tok:hover{transform:translateY(-2px)}
.tok.sel{outline:4px solid var(--sun);outline-offset:2px;transform:scale(1.06)}
.tok.lift{opacity:.3}
.tok.ok{box-shadow:0 0 0 3px var(--ok),0 4px 0 var(--ok)}
.tok.bad{box-shadow:0 0 0 3px var(--bad),0 4px 0 var(--bad);animation:shake .4s}
.tok.pic.ok,.tok.pic.bad{border-radius:50%}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform-origin:center;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));opacity:.95}
.lock .tok{cursor:default}

.mcol{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(130px,29%)}
.mcol .pc{background:#fff;border-radius:18px;width:100%;display:grid;place-items:center;padding:6px;box-shadow:0 3px 0 var(--line)}
.mcol .pc svg{width:min(80px,100%);height:auto}
.mcol .slot{width:100%;min-width:0}
.mcol .tok.chip{font-size:clamp(15px,4.2vw,20px);padding:6px 8px}
.spellrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sent{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sent .slot{min-width:70px}
.cap{width:100%;text-align:center;font-weight:800;color:var(--muted);font-size:15px}
.lines{display:flex;flex-direction:column;gap:6px;width:100%}
.lines div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 2px 0 var(--line)}
.lines .en{font-size:19px}
.lines small{color:var(--muted);font-weight:700}
.zone{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(150px,30%)}
.zone .slot{width:100%;min-height:76px}
.zone svg.obj{width:100%;max-width:120px;height:auto}
.slot .ph{font-family:var(--f-disp);font-weight:600;font-size:14px;color:#A8925F;text-align:center;line-height:1.1}
.zl{font-family:var(--f-disp);font-weight:600;color:var(--deep)}
.pond{width:100%;min-height:130px;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 40%,#7FD8EE,#2BA3C9 70%,#1B7FA5);border:4px solid #8FC97A;box-shadow:inset 0 6px 12px rgba(0,0,0,.2)}
.pond .tok.pic svg{width:44px;height:44px}
.basket{width:min(300px,100%);min-height:120px;border-radius:12px 12px 60px 60px;background:repeating-linear-gradient(45deg,#C98E55 0 8px,#B5783F 8px 16px);border:4px solid #8A5528}
.counter{font-family:var(--f-disp);font-weight:600;font-size:20px;text-align:center;color:var(--deep)}

.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 26px;font-family:var(--f-disp);font-weight:600;font-size:20px;background:var(--ac);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn[disabled]{background:#CFC3A6;cursor:not-allowed;box-shadow:0 5px 0 #B3A684}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.msg{text-align:center;font-weight:800;color:var(--bad);min-height:1.4em}

.fb{border-radius:22px;padding:14px;display:flex;gap:12px;align-items:flex-start;animation:pop .35s ease-out}
.fb.good{background:var(--okbg)}.fb.show{background:#FFF0D2}
.fb .polly{width:62px;flex:none}
.fb h3{font-size:24px;color:var(--ok)}
.fb.show h3{color:#B05A00}
.fb p{margin:4px 0 8px;font-weight:700}
.fb .btn{margin-top:4px}
@keyframes pop{from{transform:scale(.9);opacity:.2}}

.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.lc{border:0;background:#fff;border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.lc:hover{transform:translateY(-3px) rotate(-1deg)}
.lc svg.p{width:84px;height:84px}
.lc b{font-family:var(--f-disp);font-weight:600;font-size:24px;color:var(--ink)}
.lc small{color:var(--muted);font-weight:700;font-size:14px}
.lc.on{background:var(--ac2);box-shadow:0 4px 0 var(--ac);transform:scale(1.04)}
.lc .sp{position:absolute}

.sum{text-align:center;align-items:center}
.sum .bigstars{display:flex;gap:8px;justify-content:center}
.sum .bigstars svg{width:64px;height:64px}
.sum .bigstars svg.on{animation:starin .6s backwards}
.sum .bigstars svg:nth-child(2){animation-delay:.2s}.sum .bigstars svg:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:70;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<canvas id="fx" width="10" height="10"></canvas>

<script>
/*@ICONS0@*/
/* ---------- gambar ---------- */
const G=(inner,s=56,cls='')=>`<svg class="${cls}" viewBox="-20 -20 40 40" width="${s}" height="${s}" aria-hidden="true">${inner}</svg>`;

function setAccent(I){document.documentElement.style.setProperty('--ac',I.c);document.documentElement.style.setProperty('--ac2',I.cb)}
function barHTML(I,ph){return `<div class="bar"><button class="back" data-go="map">‹ Map</button>

function openIsland(i){const I=ISL[i];setAccent(I);V={view:'learn',i};renderLearn();scrollTo({top:0})}
function renderLearn(){const I=ISL[V.i];
  app.innerHTML=`${DEFS}${barHTML(I,0)}<div class="card"><div class="say">${polly('happy')}<div class="bub"><span class="en">Hello! I am Polly. Tap a picture and listen.</span><span class="sm">Halo! Aku Polly. Ketuk gambar dan dengarkan. Ucapkan katanya bersama Polly, ya.</span></div></div>
   ${I.rule?`<div class="rule"><b class="en">${I.rule[0]}</b><span class="sm">${I.rule[1]}</span></div>`:''}<div class="learn">${I.words.map(k=>`<button class="lc" data-say="${k}" data-lc="${k}">${pic(k,84,'p')}<b>${k}</b><small>${W[k].id}</small></button>`).join('')}</div>
   <div class="act"><button class="btn alt" id="all">${SPK} Listen to all</button><button class="btn" id="go">Start the quest ›</button></div></div>`;
  document.getElementById('all').onclick=async e=>{const b=e.currentTarget;b.disabled=true;for(const k of I.words){if(V.view!=='learn')break;const el=app.querySelector(`[data-lc="${k}"]`);el?.classList.add('on');await say(k);el?.classList.remove('on');await new Promise(r=>setTimeout(r,250))}b.disabled=false};
  document.getElementById('go').onclick=()=>startQuiz();
  if(!HAS_TTS)toast('Perangkat ini belum bisa membaca suara. Kata tetap bisa dibaca di layar.');
}
function startQuiz(){const I=ISL[V.i];V={view:'quiz',i:V.i,qi:0,res:[],Q:I.Q.map((q,j)=>build(q,I,j))};renderQ()}

function renderQ(){const I=ISL[V.i],q=V.Q[V.qi];V.tries=0;V.P={};V.sel=null;V.done=false;V.shown=!HAS_TTS;
  const dots=I.Q.map((_,j)=>`<i class="${j<V.qi?(V.res[j]?'ok':'no'):j===V.qi?'cur':''}"></i>`).join('');
  app.innerHTML=`${DEFS}${barHTML(I,1)}<div class="card" id="qc"><div class="qhead"><span class="qno">Quest ${V.qi+1} / ${I.Q.length}</span><span class="dots">${dots}</span><span class="qtype">${TYPE[q.t]}</span></div>
   <div class="say">${polly(q.t==='listen'?'n':'think')}<div class="bub"><span class="en">${q.ins[0]}</span><span class="sm">${q.ins[1]}</span>${q.sub?`<span class="sm tr">${q.sub}</span>`:''}</div></div>
   <div class="stage" id="stage"></div><div class="msg" id="msg" aria-live="polite"></div><div id="fbx"></div></div>`;
  const st=document.getElementById('stage');
  if(q.t==='listen'){st.innerHTML=`<div class="listen">${spkBtn(q.say,'Listen')}${spkBtn(q.say,'Slow','slow').replace(SPK,TURTLE)}</div>${HAS_TTS?'':`<div class="word-shown">${q.say}</div>`}
     <div class="opts four" style="margin-top:12px">${q.opts.map(k=>`<button class="opt w" data-pick="${k}">${k}</button>`).join('')}</div>`;
    setTimeout(()=>say(q.say),350)}
  else if(q.t==='read'){st.innerHTML=`${q.showHTML?q.showHTML():`<div class="bigpic">${pic(q.show,140)}</div>`}<div class="opts ${q.opts.length===3?'three':''}" style="margin-top:12px">${q.opts.map(k=>`<button class="opt w" data-pick="${k}">${k}</button>`).join('')}</div>`}
  else{V.q=q;drawBoard();}
}
function drawBoard(){const q=V.Q[V.qi],st=document.getElementById('stage'),P=V.P,m=V.m||{};
  const tokH=t=>`<div class="tok ${t.cls} ${t.id in m?(m[t.id]?'ok':'bad'):''} ${V.sel===t.id?'sel':''}" data-id="${t.id}" tabindex="0" role="button" aria-label="${(t.type+'').replace(/"/g,'')}">${t.html}</div>`;
  const S=(id,cls='',inner='',cap)=>`<div class="slot ${cls}" data-slot="${id}" tabindex="0" role="button" aria-label="Tempat jawaban">${inner}${q.T.filter(t=>P[t.id]===id).map(tokH).join('')}</div>`;
  const rest=q.T.filter(t=>!P[t.id]);
  const ready=q.ready?q.ready(P):q.slots.every(s=>Object.values(P).includes(s));
  st.innerHTML=`${q.top?q.top+'<div style="height:12px"></div>':''}${q.t==='build'||q.t==='spell'?'':''}<div class="board ${V.sel?'selmode':''} ${V.done?'lock':''}">${q.L(S,P)}</div>
   ${V.done?'':`<div class="tray" data-slot="tray" aria-label="Tempat ${q.tray||'kata'}">${rest.length?rest.map(tokH).join(''):`<span class="hint">All done! · Semua sudah dipasang</span>`}</div>
   <div class="act" style="margin-top:14px"><button class="btn alt" id="rs">Reset</button><button class="btn" id="ck" ${ready?'':'disabled'}>Check ✓</button></div>`}`;
  if(!V.done){document.getElementById('ck').onclick=check;document.getElementById('rs').onclick=()=>{V.P={};V.m={};V.sel=null;drawBoard()}}
}
function place(id,s){const q=V.Q[V.qi],P=V.P;const cur=P[id]||'tray';V.m={};document.getElementById('msg').textContent='';
  if(s!==cur){if(s!=='tray'){const cap=(q.cap&&q.cap[s])||1,occ=Object.keys(P).filter(k=>P[k]===s);if(occ.length>=cap){const v=occ[0];if(cur==='tray')delete P[v];else P[v]=cur}}
    if(s==='tray')delete P[id];else P[id]=s;sfx.pop();q.onPlace&&q.onPlace(P)}
  V.sel=null;drawBoard()}

let D=null;

window.addEventListener('pointermove',e=>{if(!D)return;const dx=e.clientX-D.x,dy=e.clientY-D.y;
  if(!D.moved&&Math.hypot(dx,dy)>6){D.moved=true;const r=D.el.getBoundingClientRect();D.g=D.el.cloneNode(true);D.g.classList.add('ghost');D.g.classList.remove('sel','ok','bad');D.g.style.width=r.width+'px';D.g.style.height=r.height+'px';D.ox=D.x-r.left;D.oy=D.y-r.top;document.body.appendChild(D.g);D.el.classList.add('lift')}
  if(D.moved){D.g.style.transform=`translate(${e.clientX-D.ox}px,${e.clientY-D.oy}px) scale(1.08) rotate(-3deg)`;D.g.style.display='none';const el=document.elementFromPoint(e.clientX,e.clientY);D.g.style.display='';
    app.querySelectorAll('.hov').forEach(x=>x.classList.remove('hov'));const sl=el&&el.closest('#stage [data-slot]');if(sl)sl.classList.add('hov')}});
window.addEventListener('pointerup',e=>{if(!D)return;const d=D;D=null;
  if(d.moved){d.g.style.display='none';const el=document.elementFromPoint(e.clientX,e.clientY);d.g.remove();const sl=el&&el.closest('#stage [data-slot]');if(sl)place(d.id,sl.dataset.slot);else drawBoard()}
  else tapTok(d.id)});
window.addEventListener('pointercancel',()=>{if(D){D.g&&D.g.remove();D=null;drawBoard()}});
function tapTok(id){if(V.sel&&V.sel!==id){const s=V.P[id]||'tray';place(V.sel,s);return}V.sel=V.sel===id?null:id;drawBoard();
  if(V.sel){const q=V.Q[V.qi],t=q.T.find(t=>t.id===id);if(t.cls==='chip'||t.cls==='paint')say(String(t.type).replace('.',''),.85);const el=app.querySelector(`.tok[data-id="${id}"]`);el&&el.focus({preventScroll:true})}}
app.addEventListener('click',e=>{
  const sp=e.target.closest('[data-say]');if(sp){e.stopPropagation();sp.classList.add('playing');say(sp.dataset.say,sp.classList.contains('slow')?.5:.8).then(()=>sp.classList.remove('playing'));if(!sp.classList.contains('lc')&&!sp.classList.contains('st'))return}
  const op=e.target.closest('[data-open]');if(op){openIsland(+op.dataset.open);return}
  const go=e.target.closest('[data-go]');if(go){window.speechSynthesis&&speechSynthesis.cancel();V={view:'map'};renderMap();return}
  const pk=e.target.closest('[data-pick]');if(pk&&!pk.disabled){pick(pk);return}
  const sl=e.target.closest('#stage [data-slot]');if(sl&&V.sel&&!e.target.closest('.tok')){place(V.sel,sl.dataset.slot)}
});
app.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target;
  if(t.classList.contains('tok')){e.preventDefault();tapTok(t.dataset.id)}
  else if(t.matches('#stage [data-slot]')&&V.sel){e.preventDefault();place(V.sel,t.dataset.slot)}
  else if(t.matches('g.isl')){e.preventDefault();openIsland(+t.dataset.open)}});

function pick(b){const q=V.Q[V.qi],k=b.dataset.pick;
  if(k===q.ans){b.classList.add('ok');app.querySelectorAll('[data-pick]').forEach(x=>x.disabled=true);finish(true)}
  else{b.classList.add('bad');b.disabled=true;sfx.bad();V.tries++;
    if(V.tries>=2){app.querySelector(`[data-pick="${q.ans}"]`).classList.add('ok');app.querySelectorAll('[data-pick]').forEach(x=>x.disabled=true);finish(false)}
    else document.getElementById('msg').textContent=q.t==='listen'?'Try again! · Dengarkan sekali lagi, lalu coba lagi.':'Try again! · Belum tepat, coba lagi.'}}
function check(){const q=V.Q[V.qi],r=chk(q,V.P);V.m=r.m;
  if(r.ok){V.done=true;drawBoard();finish(true);return}
  sfx.bad();V.tries++;
  if(V.tries>=2){V.P=solve(q);V.m={};Object.keys(V.P).forEach(id=>V.m[id]=true);V.done=true;drawBoard();finish(false);return}
  drawBoard();document.getElementById('msg').textContent=r.hint||'Try again! · Yang merah belum tepat.';
  setTimeout(()=>{if(V.done)return;Object.keys(r.m).forEach(id=>{if(!r.m[id])delete V.P[id]});V.m={};drawBoard()},1100)}
function finish(ok){const q=V.Q[V.qi],first=ok&&V.tries===0;V.res[V.qi]=first;V.done=true;
  if(ok)sfx.ok();
  const praise=[['Great job!','Hebat!'],['Awesome!','Keren!'],['Super!','Pintar!'],['Well done!','Bagus sekali!'],['Excellent!','Luar biasa!'],['Amazing!','Mantap!']][V.qi%6];
  document.getElementById('msg').textContent='';
  document.getElementById('fbx').innerHTML=`<div class="fb ${ok?'good':'show'}">${polly(ok?'happy':'oops')}<div style="min-width:0"><h3>${ok?(first?praise[0]:'You did it!'):'Look at the answer'}</h3><span class="sm">${ok?(first?praise[1]:'Akhirnya benar!'):'Yuk, lihat jawabannya.'}</span>
    <p class="ansl">Answer: <span class="en">${q.ansEN||q.answerSay}</span></p><p class="note">${q.exp}</p><div class="act" style="justify-content:flex-start">${spkBtn(q.answerSay,'Listen','slow')}<button class="btn" id="nx">${V.qi<V.Q.length-1?'Next ›':'Treasure ›'}</button></div></div></div>`;
  document.getElementById('nx').onclick=()=>{if(V.qi<V.Q.length-1){V.qi++;renderQ();document.getElementById('qc').scrollIntoView({block:'start',behavior:'smooth'})}else summary()};
  setTimeout(()=>say(q.answerSay),ok?700:300);
  document.getElementById('fbx').scrollIntoView({block:'nearest',behavior:'smooth'})}
function summary(){const I=ISL[V.i],n=V.res.filter(Boolean).length,stars=n===6?3:n>=4?2:1;
  const prev=SAVE[I.key]||{};SAVE[I.key]={done:true,stars:Math.max(prev.stars||0,stars),best:Math.max(prev.best||0,n)};persist();
  const all=ISL.every(x=>SAVE[x.key]?.done),pieces=ISL.filter(x=>SAVE[x.key]?.done).length;
  const nxt=(V.i+1)%ISL.length;V.view='sum';
  const piece=`<svg viewBox="0 0 120 90" width="120" aria-hidden="true"><path d="M8 10 L60 4 L112 12 L106 48 L114 82 L58 86 L6 80 L12 46Z" fill="#F2DFAF" stroke="#8A6234" stroke-width="3"/><path d="M20 60 q20 -30 40 -10 t40 -20" stroke="#B3362B" stroke-width="3" stroke-dasharray="6 5" fill="none"/><path d="M92 22 l10 10 M102 22 l-10 10" stroke="#B3362B" stroke-width="4" stroke-linecap="round"/><g transform="translate(34 52) scale(.7)">${islBase}</g></svg>`;
  app.innerHTML=`${DEFS}${barHTML(I,2)}<div class="card sum"><div class="bigstars">${[0,1,2].map(j=>STAR(j<stars)).join('')}</div>
   <h2 style="font-size:32px;color:var(--ac)">${stars===3?'Perfect!':stars===2?'Great job!':'Keep practicing!'}</h2>
   <p style="margin:0;font-weight:700">${stars===3?'Sempurna!':stars===2?'Bagus sekali!':'Terus berlatih, ya!'} Kamu benar <b>${n} dari 6</b> pada percobaan pertama.</p>
   <div class="reward">${all?G(chestSVG(true),110):piece}<div><b class="en">${all?'You found the treasure!':`You got a map piece! (${pieces}/5)`}</b><span class="sm">${all?'Kamu menemukan harta karun! Semua pulau selesai.':`Kamu mendapat potongan peta! Kumpulkan 5 untuk membuka peti harta.`}</span></div></div>
   <div class="say" style="text-align:left;width:100%">${polly('happy')}<div class="bub"><span class="en">New stickers for your Treasure Book!</span><span class="sm">Stiker kata baru untuk Buku Stikermu. Ketuk untuk mendengar lagi.</span></div></div>
   <div class="stk" style="width:100%">${I.words.map(k=>`<button class="st" data-say="${k}">${pic(k,44)}<span>${k}</span></button>`).join('')}</div>
   <div class="act"><button class="btn alt" id="again">Play again</button><button class="btn" data-open="${nxt}">Next island ›</button><button class="btn alt" data-go="map">Map</button></div></div>`;
  document.getElementById('again').onclick=()=>openIsland(V.i);
  sfx.fan();confetti();if(all)setTimeout(confetti,900);scrollTo({top:0,behavior:'smooth'})}

renderMap();
window.__EI={ISL,V:()=>V,build,chk,solve,W};
</script>
