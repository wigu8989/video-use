<title>说话 Reel Hector</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen reel — top bar (category chips + progress), one phrase per card, big round microphone in the middle, reel-style action rail on the right; swipe up/down between phrases. */
:root{
 --bg:#F1EFF7;--surface:#FFFFFF;--surface2:#E6E2F1;--fg:#25213A;--muted:#605B78;
 --accent:#5B4BC4;--accent-fg:#FFFFFF;--ok:#1F8A5B;--okbg:#DDF2E6;--bad:#B9432F;--badbg:#F8E1DB;--glow:#9F92F0;
 --f-disp:'Fredoka','Baloo 2',system-ui,sans-serif;--f-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141220;--surface:#1D1A2C;--surface2:#29253D;--fg:#ECE9F7;--muted:#A49FBE;--accent:#A497F5;--accent-fg:#16132A;--ok:#6FD39E;--okbg:#18352A;--bad:#F29A86;--badbg:#3E2420;--glow:#6C5CE0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141220;--surface:#1D1A2C;--surface2:#29253D;--fg:#ECE9F7;--muted:#A49FBE;--accent:#A497F5;--accent-fg:#16132A;--ok:#6FD39E;--okbg:#18352A;--bad:#F29A86;--badbg:#3E2420;--glow:#6C5CE0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-direction:column;gap:8px;min-width:0}
.row1{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:20px}.brand span{color:var(--accent)}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{width:64px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:13px;color:var(--muted);min-height:34px}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.stage{position:relative;min-height:0;overflow:hidden}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-right:58px;padding-bottom:44px;text-align:center}
.card.in-up{animation:inUp .32s cubic-bezier(.2,.8,.2,1)}.card.in-down{animation:inDown .32s cubic-bezier(.2,.8,.2,1)}
@keyframes inUp{from{transform:translateY(38%);opacity:0}}@keyframes inDown{from{transform:translateY(-38%);opacity:0}}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--okbg);color:var(--ok)}
.phrase{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;max-width:100%;font-weight:700;line-height:1.25}
.phrase.zh{font-size:clamp(40px,15vw,72px);gap:0 2px}.phrase.zh.long{font-size:clamp(24px,7.4vw,40px)}
.phrase.en{font-family:var(--f-disp);font-size:clamp(24px,7vw,38px);gap:2px 8px}
.w{border-radius:8px;padding:0 2px;transition:color .2s,background .2s}
.w.hit{color:var(--ok);background:var(--okbg)}.w.miss{color:var(--bad);background:var(--badbg)}
.py{font-family:var(--f-disp);font-weight:600;font-size:18px;color:var(--accent);min-height:1.2em}
.mean{font-weight:700;color:var(--muted);font-size:15px;max-width:34ch}
.mic{position:relative;width:112px;height:112px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:44px;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .12s}
.mic:active{transform:scale(.94)}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--glow);animation:ring 1.4s ease-out infinite}
.mic.on::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.mic.pass{background:var(--ok)}
.miclbl{font-weight:800;font-size:14px;color:var(--muted);min-height:1.3em}
.heard{min-height:1.4em;font-weight:700;font-size:14px;color:var(--muted);max-width:36ch}
.res{font-weight:800;font-size:16px;min-height:1.3em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.nomic{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:34ch}
.nomic p{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.btn{background:var(--ok);color:var(--surface);border-radius:999px;padding:12px 20px;font-weight:800;font-size:16px;min-height:48px}
.hintline{position:absolute;left:0;right:58px;bottom:6px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.hintline b{display:inline-block;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.rail{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:3}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;width:54px}
.rb .ic{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:19px;font-weight:800;transition:transform .12s}
.rb:active .ic{transform:scale(.9)}.rb.on .ic{background:var(--accent);color:var(--accent-fg)}
.rb small{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.1}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:700;padding:20px}
.flow{list-style:none;margin:0;padding:0;display:flex;gap:6px;justify-content:center}
.flow li{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.flow li.on{background:var(--accent);color:var(--accent-fg)}
.miclbl.live{color:var(--accent);font-size:17px}
.res{font-size:18px;max-width:30ch}
.link{font-weight:800;font-size:13px;color:var(--accent);text-decoration:underline;margin-top:4px}
#micwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
 <header class="top">
  <div class="row1"><div class="brand">说话 <span>Reel</span></div><div class="prog" id="prog"></div></div>
  <nav class="chips" id="chips" aria-label="Pilih kelompok"></nav>
 </header>
 <main class="stage" id="stage"><div class="empty">Memuat latihan…</div></main>
</div>
