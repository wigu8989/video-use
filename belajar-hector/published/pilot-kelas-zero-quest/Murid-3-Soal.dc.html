<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mengerjakan soal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;family=Press+Start+2P&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 18px; background: #160E30; color: #F6F1FF; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px;">
  <div style="display: flex; align-items: center; gap: 8px;">
    <a href="Murid-2-Beranda.dc.html" style="text-decoration: none; border: 2px solid #4A3A7E; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; color: #F6F1FF;">‹ Keluar</a>
    <b style="font-family: Fredoka, sans-serif; font-size: 17px;">Slime Meadow · 8/20</b>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #3DDC84;"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#3DDC84"/></svg>Tersimpan</span>
  </div>
  <div style="display: flex; gap: 8px;">
    <div style="flex: 1; background: #1E1638; border: 2px solid #6A55A8; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px;"><span style="font-family: 'Press Start 2P', monospace; font-size: 8px;">ZERO</span><div style="height: 8px; background: #3A1520; border-radius: 4px;"><div style="width: 90%; height: 100%; background: #3DDC84; border-radius: 4px;"></div></div></div>
    <div style="flex: 1; background: #1E1638; border: 2px solid #6A55A8; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end;"><span style="font-family: 'Press Start 2P', monospace; font-size: 8px;">GREEN SLIME</span><div style="height: 8px; width: 100%; background: #3A1520; border-radius: 4px; display: flex; justify-content: flex-end;"><div style="width: 46%; height: 100%; background: #E5242F; border-radius: 4px;"></div></div></div>
  </div>
  <div style="height: 150px; border-radius: 16px; border: 3px solid #6A55A8; background: linear-gradient(#7CC8F2, #D9F3FF 70%, #7CCB5E 70%); position: relative; overflow: hidden;">
    <svg width="60" height="110" viewBox="0 0 60 110" style="position: absolute; left: 60px; bottom: 20px;" aria-hidden="true"><path d="M22 18 Q22 4 30 4 Q38 4 38 18 Q38 26 30 27 Q22 26 22 18Z" fill="#EEF1F4"/><path d="M24 14 L37 12 L38 19 Q30 23 24 20Z" fill="#141018" stroke="#FF2E4D"/><path d="M20 30 h20 l3 40 h-26z" fill="#E1E5EA"/><path d="M24 32 L30 46 L36 32" stroke="#FF2E4D" stroke-width="2" fill="none"/><path d="M24 70 l-3 36 M36 70 l3 36" stroke="#D9DDE3" stroke-width="7" stroke-linecap="round"/></svg>
    <svg width="90" height="80" viewBox="0 0 90 80" style="position: absolute; right: 50px; bottom: 26px;" aria-hidden="true"><path d="M2 78 Q-2 40 22 18 Q45 -2 68 18 Q92 40 88 78Z" fill="#6BE38A" stroke="#3A9A55" stroke-width="3"/><circle cx="32" cy="40" r="7" fill="#fff"/><circle cx="58" cy="40" r="7" fill="#fff"/><circle cx="33" cy="41" r="3" fill="#1B1B2A"/><circle cx="59" cy="41" r="3" fill="#1B1B2A"/><path d="M34 58 Q45 66 56 58" stroke="#1B1B2A" stroke-width="3" fill="none"/></svg>
  </div>
  <div style="background: #1E1638; border: 2px solid #4A3A7E; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <span style="align-self: flex-start; background: #2A1F4D; border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: 12px;"><span style="color: #FF7A3A;">⚔</span> Damage Math</span>
    <b style="font-family: Fredoka, sans-serif; font-size: 20px; line-height: 1.2;">The slime has 20 HP. Zero hits 6. How much HP is left?</b>
    <span style="font-size: 14px; color: #BDB2E0; font-weight: 700;">Slime punya 20 HP. Zero menyerang 6. Sisa HP berapa?</span>
    <div style="align-self: center; min-width: 120px; text-align: center; font-family: 'Press Start 2P', monospace; font-size: 24px; padding: 10px 14px; border-radius: 12px; background: #0A0618; border: 3px solid #FFC93C; color: #FFC93C;">{{shown}}</div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="10">
        <button onClick="{{k.press}}" aria-label="Angka {{k.n}}" style="min-height: 44px; border: 0; border-radius: 10px; background: #2A1F4D; color: #F6F1FF; font-family: 'Press Start 2P', monospace; font-size: 14px; box-shadow: inset 0 0 0 2px #4A3A7E; cursor: pointer;">{{k.n}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px;">
      <button onClick="{{clear}}" style="flex: 1; min-height: 46px; border: 2px solid #4A3A7E; border-radius: 12px; background: transparent; color: #FF6B7F; font-weight: 800; font-size: 15px; cursor: pointer;">Hapus</button>
      <button onClick="{{attack}}" style="flex: 2; min-height: 46px; border: 0; border-radius: 12px; background: #FF2E4D; color: #fff; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px; cursor: pointer;">ATTACK!</button>
    </div>
  </div>
  <sc-if value="{{isRight}}" hint-placeholder-val="{{false}}">
    <div style="background: #12402C; border: 2px solid #3DDC84; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px;">
      <b style="font-family: Fredoka, sans-serif; font-size: 18px; flex: 1;">CRITICAL HIT! 20 − 6 = 14</b>
      <a href="Murid-4-Selesai.dc.html" style="text-decoration: none; background: #3DDC84; color: #12402C; border-radius: 999px; padding: 8px 14px; font-weight: 800;">Lanjut ›</a>
    </div>
  </sc-if>
  <sc-if value="{{isWrong}}" hint-placeholder-val="{{false}}">
    <div style="background: #3E2C10; border: 2px solid #C98A00; border-radius: 14px; padding: 10px 12px; font-weight: 800; color: #FFC93C;">Try again! Coba lagi. Tekan Help kalau bingung.</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { num: '', res: '' }; }
  renderVals() {
    const s = this.state;
    return {
      shown: s.num || '?',
      keys: ['1','2','3','4','5','6','7','8','9','0'].map((n) => ({ n, press: () => this.setState({ num: (s.num + n).slice(0, 3), res: '' }) })),
      clear: () => this.setState({ num: '', res: '' }),
      attack: () => this.setState({ res: s.num === '14' ? 'ok' : 'no' }),
      isRight: s.res === 'ok',
      isWrong: s.res === 'no'
    };
  }
}
</script>
</body>
</html>
