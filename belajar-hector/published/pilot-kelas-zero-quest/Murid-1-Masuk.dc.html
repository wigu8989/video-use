<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Masuk kelas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 24px 28px; background: #160E30; color: #F6F1FF; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
    <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#2A1F4D" stroke="#FFC93C" stroke-width="3"/><path d="M24 30 Q24 16 36 16 Q48 16 48 30 Q48 40 36 42 Q24 40 24 30Z" fill="#E8ECF0"/><path d="M27 28 L45 26 L46 33 Q36 38 27 34Z" fill="#141018" stroke="#FF2E4D" stroke-width="1.5"/><path d="M30 44 h12 l3 16 h-18z" fill="#E8ECF0"/><path d="M33 46 L36 52 L39 46" stroke="#FF2E4D" stroke-width="2" fill="none"/></svg>
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-size: 32px; font-weight: 700;">Zero <span style="color: #FFC93C;">Quest</span></h1>
    <p style="margin: 0; font-size: 15px; color: #BDB2E0; font-weight: 700;">Masukkan kode kelas dari Bu Guru</p>
  </div>
  <label for="kode" style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 14px; color: #BDB2E0;">Kode kelas
    <input id="kode" value="ZERO-2A" style="font-family: Fredoka, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.12em; text-align: center; padding: 14px; border-radius: 16px; border: 3px solid #FFC93C; background: #0A0618; color: #FFC93C;">
  </label>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-weight: 800; font-size: 14px; color: #BDB2E0;">Ketuk namamu</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{names}}" as="n" hint-placeholder-count="10">
        <button onClick="{{n.pick}}" style="{{n.style}}">{{n.name}}</button>
      </sc-for>
    </div>
  </div>
  <a href="Murid-2-Beranda.dc.html" style="margin-top: auto; text-decoration: none; text-align: center; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 22px; padding: 16px; border-radius: 999px; background: #FF2E4D; color: #fff; box-shadow: 0 5px 0 #8A1328;">Masuk ›</a>
  <p style="margin: 0; text-align: center; font-size: 13px; color: #8F84B8;">Tidak perlu email atau kata sandi</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 'Bima' }; }
  renderVals() {
    const all = ['Aisyah','Bima','Citra','Dimas','Eka','Fajar','Gita','Hana','Iqbal','Joko'];
    return {
      names: all.map((name) => {
        const on = this.state.picked === name;
        return {
          name,
          pick: () => this.setState({ picked: name }),
          style: 'font: 700 17px Nunito, sans-serif; padding: 12px 8px; border-radius: 14px; min-height: 48px; cursor: pointer; ' + (on ? 'background: #FFC93C; color: #1E1638; border: 2px solid #FFE27A;' : 'background: #2A1F4D; color: #F6F1FF; border: 2px solid #4A3A7E;')
        };
      })
    };
  }
}
</script>
</body>
</html>
