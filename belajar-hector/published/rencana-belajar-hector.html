<title>Rencana Belajar Hector</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a weekly study planner — header + day tabs (like a school timetable), the chosen night's checklist beside tomorrow's lessons, then subject practice cards. */
:root{
 --paper:#F7F4EE;--paper2:#EEE9DE;--ink:#2F3542;--muted:#5F6573;--line:#E2DCCF;--accent:#3F6F8F;--accent2:#8A6416;--floor:#E6DCC6;
 --ok:#2F7A4F;--okbg:#E3F0E5;--bad:#B4473C;--showbg:#FAEFD8;--card:#FFFDF8;--shadow:0 1px 2px rgba(60,50,30,.06),0 6px 18px rgba(60,50,30,.06);
 --a-wall:#E9EEF0;--a-win:#C9DCE6;--a-moon:#F4E3B0;--a-desk:#C9A983;--a-desk2:#E3D3BC;--a-glow:#FBE9C2;--a-book:#FFFDF8;--a-line:#B9B2A4;--a-cup:#9BB7A8;--a-lamp:#6E7480;
 --f-disp:'Fredoka','Baloo 2',system-ui,sans-serif;--f-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1C1F27;--paper2:#262A34;--ink:#DADDE4;--muted:#A2A8B4;--line:#343947;--accent:#93B8D6;--accent2:#DCC27A;--floor:#3A3428;--ok:#86C99B;--okbg:#1F3328;--bad:#E79A8F;--showbg:#3A3220;--card:#22262F;--shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.18);
 --a-wall:#2A2F3B;--a-win:#1F2A3C;--a-moon:#E9D9A6;--a-desk:#5B4A39;--a-desk2:#3A332B;--a-glow:#4A4130;--a-book:#D9D4C8;--a-line:#8E887C;--a-cup:#5E7D70;--a-lamp:#9AA0AC;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1C1F27;--paper2:#262A34;--ink:#DADDE4;--muted:#A2A8B4;--line:#343947;--accent:#93B8D6;--accent2:#DCC27A;--floor:#3A3428;--ok:#86C99B;--okbg:#1F3328;--bad:#E79A8F;--showbg:#3A3220;--card:#22262F;--shadow:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.18);
 --a-wall:#2A2F3B;--a-win:#1F2A3C;--a-moon:#E9D9A6;--a-desk:#5B4A39;--a-desk2:#3A332B;--a-glow:#4A4130;--a-book:#D9D4C8;--a-line:#8E887C;--a-cup:#5E7D70;--a-lamp:#9AA0AC;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-disp);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.top{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.top>div:first-child{flex:1 1 380px;min-width:0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(30px,6vw,44px)}.top p{margin:4px 0 0;color:var(--muted);font-weight:600}
.prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:200px;display:flex;flex-direction:column;gap:4px}
.prog b{font-family:var(--f-disp);font-size:28px;font-variant-numeric:tabular-nums}.prog span{font-size:13px;color:var(--muted);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--paper2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
.day{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.day small{font-size:12px;color:var(--muted);font-weight:700}.day b{font-family:var(--f-disp);font-size:19px}.day span{font-size:12px;font-weight:800;color:var(--muted)}.day em{font-style:normal;color:var(--bad)}
.day.on{border:2px solid var(--accent);box-shadow:0 3px 0 var(--accent)}
.daycard{display:flex;flex-wrap:wrap;gap:16px}
.school{flex:1 1 300px;min-width:0;background:var(--paper2);border-radius:18px;padding:16px}
.tasks{flex:2 1 420px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.daycard h2{font-size:21px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}.daycard h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.school ul{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}.school li{display:flex;gap:8px;font-size:15px}
.sj{font-weight:800;min-width:96px}.test{color:var(--bad);font-weight:800}
.tip{margin:0;font-size:14px;font-weight:700;background:var(--card);border-radius:12px;padding:8px 10px;border:1px dashed var(--line)}
.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}.task:last-child{border:0}
.task input{width:24px;height:24px;flex:none;accent-color:var(--ok)}.task label{flex:1;min-width:0;cursor:pointer}.task small{color:var(--muted);font-weight:700;white-space:nowrap}
.task.done label{text-decoration:line-through;color:var(--muted)}
.go{border:0;background:var(--paper2);border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap;min-height:40px}
.h2{font-size:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}.h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.subc{border:1px solid var(--line);border-top:5px solid var(--c);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.subc:hover{transform:translateY(-2px)}.subc b{font-family:var(--f-disp);font-size:19px}.subc span{font-size:13px;color:var(--muted);font-weight:700}.subc .meta{margin-top:4px}.subc em{font-style:normal;color:var(--accent2)}
.foot{font-size:13px;color:var(--muted);margin:0}.foot em{font-style:normal;color:var(--accent2);font-weight:800}
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qbar .bar{flex:1 1 140px}.qbar b{font-family:var(--f-disp);font-size:20px}.qbar span{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800}
.qcard{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qcard h2{font-size:clamp(21px,5vw,26px)}
.fig{width:100%;max-width:520px;height:auto;align-self:center}.fig .lb{font:700 12px var(--f-body);fill:var(--muted)}
.shrow{display:flex;justify-content:center;gap:10px}.shrow div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper2);border-radius:12px;padding:6px 8px}.shrow .n{font-weight:800;font-size:13px;color:var(--muted)}.shrow small{font-weight:700}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.pat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:var(--paper2);border-radius:14px;padding:12px}
.dot{display:inline-block;width:36px;height:36px;border-radius:50%;border:2px solid rgba(0,0,0,.15);vertical-align:middle}
.pq{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:3px dashed var(--accent);font:700 22px var(--f-disp);color:var(--accent)}
.stars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:280px;align-self:center}
.bigimg{align-self:center}
.read{margin:0;background:var(--paper2);border-radius:12px;padding:12px 14px;font-size:17px;border-left:5px solid var(--c)}
.zh{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.zh span{font-size:clamp(44px,12vw,64px);font-weight:700}
.lis{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spk{border:0;border-radius:999px;padding:10px 16px;font-weight:800;background:var(--paper2);min-height:44px}.spk.big{background:var(--c);color:#fff;font-size:18px;padding:12px 22px}
.opts{display:grid;gap:10px}.opts.patopts{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:800;font-size:18px;text-align:left;display:flex;align-items:center;gap:10px;min-height:52px}
.patopts .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;font-size:15px}
.opt:hover{border-color:var(--c)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{border-color:var(--bad);opacity:.5}
.msg{min-height:1.2em;text-align:center;font-weight:800;color:var(--bad)}
.fbk{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}.fbk.good{background:var(--okbg)}.fbk.show{background:var(--showbg)}.fbk>b{font-family:var(--f-disp);font-size:21px}.fbk p{margin:0}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:16px;background:var(--c,var(--accent));color:#fff;align-self:flex-start;min-height:44px}
.btn.alt{background:var(--paper2);color:var(--ink)}.btn:disabled{opacity:.4}
.act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bin{border:2px dashed var(--line);background:var(--paper2);border-radius:14px;padding:8px;min-height:130px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:center}
.bin b{font-family:var(--f-disp);font-size:16px}.bin small{font-size:11px;color:var(--muted);font-weight:700}.bin .in{display:flex;flex-direction:column;gap:4px}
.bin i{font-style:normal;background:var(--card);border-radius:8px;padding:4px;font-weight:800;font-size:14px}.bin i.okk{outline:2px solid var(--ok)}.bin i.badd{outline:2px solid var(--bad)}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;border-radius:14px;background:var(--paper2)}
.tok{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:800;min-height:44px}.tok.sel{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}
.target{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--paper2);border-radius:14px;padding:12px}
.target .tw{font-family:var(--f-disp);font-size:clamp(22px,5.4vw,30px);font-weight:600;padding:0 6px;border-radius:8px}.tw.hit{background:var(--okbg);color:var(--ok)}.tw.miss{color:var(--bad);text-decoration:underline wavy}
.micbtn{align-self:center;border:0;border-radius:50%;width:132px;height:132px;background:var(--c);color:#fff;font-size:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 25%,transparent)}
.micbtn span{font-size:12px;font-weight:800;padding:0 8px}.micbtn.on{animation:ring 1.2s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 22px transparent}}
.heard{text-align:center;color:var(--muted);font-weight:700;margin:0;min-height:1.4em}
.self{background:var(--paper2);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.self p{margin:0;font-weight:700}
.kb{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.hand{display:flex;gap:6px}
.key{width:58px;height:62px;border-radius:10px;background:var(--paper2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:22px;font-weight:700}
.key small{font-family:var(--f-body);font-size:9.5px;color:var(--muted);font-weight:700}.key.bump{border-color:var(--c);border-bottom-width:5px}
.tline{margin:0;text-align:center;font-size:18px}.tline b{font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:.08em;background:var(--paper2);padding:2px 10px;border-radius:8px}
#tin{font:600 24px ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;width:min(100%,420px);align-self:center}
#tin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.res{align-items:center;text-align:center}.res .big{font-family:var(--f-disp);font-size:64px;font-weight:700;color:var(--c)}
@media (max-width:420px){.key{width:44px;height:54px;font-size:18px}.key small{font-size:8px}.bins.n3,.bins.n4{grid-template-columns:1fr!important}.bin{min-height:96px}.bins.n2 .bin .tok{font-size:13px;padding:6px 8px}}
/* animasi & drag */
.qcard{animation:slidein .35s ease-out}@keyframes slidein{from{transform:translateY(14px);opacity:.3}}
.opt{transition:transform .12s,border-color .12s}.opt:active{transform:scale(.97)}
.opt.ok{animation:pop .45s}@keyframes pop{40%{transform:scale(1.06)}}
.opt.bad{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.spark{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:60;animation:spark .85s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(200deg);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.auto{display:flex;flex-direction:column;gap:3px}.auto i{display:block;height:6px;border-radius:4px;background:var(--ok);transform-origin:left;animation:autobar 2.4s linear both}.auto span{font-size:12px;font-weight:800;color:var(--muted)}
@keyframes autobar{from{transform:scaleX(0)}}
.bin{cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.bin.ready{border-color:var(--c);border-style:solid}.bin.hov{background:color-mix(in srgb,var(--c) 18%,var(--paper2));transform:scale(1.03)}
.bin.hascan{padding-top:4px}.can{width:min(110px,80%);height:auto;align-self:center;overflow:visible}
.can .lid{transform-origin:12px 18px;transition:transform .25s}.bin.hov .can .lid,.bin.gulp .can .lid{transform:rotate(-28deg) translateY(-4px)}
.bin.gulp{animation:gulp .5s}@keyframes gulp{30%{transform:scale(1.06)}60%{transform:scale(.98)}}
.bin .in{flex-wrap:wrap;flex-direction:row!important;justify-content:center}
.tok{touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;gap:6px;cursor:grab;transition:transform .12s}
.tok.ic{flex-direction:column;gap:2px;padding:6px 8px;font-size:13px}.tok.ic span{line-height:1.1}
.tok:hover{transform:translateY(-2px)}.tok.lift{opacity:.3}.tok.okk{box-shadow:0 0 0 3px var(--ok);border-color:var(--ok)}.tok.badd{box-shadow:0 0 0 3px var(--bad);border-color:var(--bad);animation:shake .4s}
.tok.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.dhint{margin:-4px 0 -6px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
#scheck.ready{animation:readyp 1.2s ease-in-out infinite}@keyframes readyp{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 30%,transparent)}}
.res .big{animation:pop .6s}
/* nama & penilaian */
.namebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.namebox label{font-weight:800;font-size:14px}
#nama{font:700 18px var(--f-body);padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:min(220px,100%)}
#nama:focus{border-color:var(--accent);outline:none}
.btn.rap{background:var(--accent);padding:9px 16px}
.scorewrap{display:flex;align-items:center;gap:16px;justify-content:center}
.pred{display:flex;flex-direction:column;align-items:center;border:3px solid var(--p);color:var(--p);border-radius:16px;padding:6px 14px;font-weight:800}.pred b{font-family:var(--f-disp);font-size:34px;line-height:1}
.tally{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tally span{display:flex;flex-direction:column;align-items:center;background:var(--paper2);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;min-width:96px}.tally b{font-family:var(--f-disp);font-size:24px}
.t1 b{color:var(--ok)}.t2 b{color:var(--accent2)}.t3 b{color:var(--bad)}
.rule{margin:0;font-size:13px;color:var(--muted);text-align:center}
.wrongs{align-self:stretch;text-align:left;background:var(--showbg);border-radius:14px;padding:12px 14px}.wrongs h3{margin:0 0 6px;font-family:var(--f-disp)}.wrongs ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}.wrongs li span{display:block;font-size:14px;color:var(--muted)}
.rapor{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:slidein .35s ease-out}
.rhead{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}.rhead>div:first-child{flex:1 1 280px;min-width:0}.rhead p{margin:2px 0 0;color:var(--muted);font-weight:700}
.avg{border:3px solid var(--p,var(--line));border-radius:18px;padding:10px 18px;display:flex;flex-direction:column;align-items:center}.avg span{font-size:13px;font-weight:800;color:var(--muted)}.avg b{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--p,var(--ink))}.avg em{font-style:normal;font-weight:800;color:var(--p,var(--muted))}
.advice{margin:0;background:var(--showbg);border-radius:12px;padding:10px 12px;font-weight:700}.advice.good{background:var(--okbg)}
.tblwrap{overflow-x:auto}.rapor table{width:100%;min-width:640px;border-collapse:collapse;font-size:15px}.rapor th{text-align:left;font-size:12px;color:var(--muted);padding:6px}.rapor td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.rapor td .mini{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--paper2);overflow:hidden;vertical-align:middle;margin-right:8px}.rapor td .mini i{display:block;height:100%}
.num{font-variant-numeric:tabular-nums}.na{color:var(--muted);font-size:13px}
.chip{display:inline-block;border:2px solid var(--p);color:var(--p);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;white-space:nowrap}
.rapor h3{margin:0;font-family:var(--f-disp);font-size:20px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}.hist li{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:4px;font-size:14px}.hist li .num{font-weight:800}
.btn.danger{background:var(--bad)}
.start{align-items:center;text-align:center}.start p{margin:0;color:var(--muted);font-weight:700}
.startopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.sbtn{border:2px solid var(--line);background:var(--paper2);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,border-color .12s}
.sbtn:hover{transform:translateY(-3px);border-color:var(--c)}.sbtn b{font-family:var(--f-disp);font-size:36px;color:var(--c);line-height:1}.sbtn span{font-weight:800}.sbtn small{color:var(--muted);font-weight:700}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:calc(100% - 32px);text-align:center}

.rcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.rc{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--c);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.rc .sic,.rd .sic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));flex:none}

.rc .btn{background:var(--c);color:var(--card);flex:none;padding:10px 14px}
.rh{margin:4px 0 0;font-family:var(--f-disp);font-size:18px}
.rds{display:flex;gap:8px;flex-wrap:wrap}
.rd{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px 8px 8px;text-align:left}
.rd .sic{width:32px;height:32px;border-radius:10px}.rd b{display:block;font-size:14px}.rd small{color:var(--muted);font-weight:700;font-size:12px}
@media (max-width:420px){.rc{flex-wrap:wrap}.rc .btn{width:100%}}

function hovAt(x,y){if(!DR||!DR.g)return;DR.g.style.display='none';const el=document.elementFromPoint(x,y);DR.g.style.display='';document.querySelectorAll('.bin.hov').forEach(b=>b.classList.remove('hov'));const b=el&&el.closest('.bin');if(b)b.classList.add('hov')}

function burst(el){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='spark';const a=i/14*Math.PI*2,d=60+Math.random()*50;s.style.left=cx+'px';s.style.top=cy+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.background=['#FFC93C','#3FA34D','#E5484D','#3D7BE0','#8E5BD8'][i%5];document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');
  const P=[...Array(120)].map(()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.3,vx:(Math.random()-.5)*12,vy:-Math.random()*11-4,r:Math.random()*6+4,c:['#FFC93C','#3FA34D','#E5484D','#3D7BE0','#8E5BD8'][Math.random()*5|0],a:Math.random()*6}));let f=0;
  (function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<140)requestAnimationFrame(tick);else c.remove()})()}

const norm=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
function lev(a,b){const d=[...Array(b.length+1)].map((_,i)=>[i]);for(let j=1;j<=a.length;j++)d[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(b[i-1]===a[j-1]?0:1));return d[b.length][a.length]}
const ZP=/[，。！？、：；“”‘’,.!?\s]/g;
const TRAD={'個':'个','歲':'岁','讓':'让','媽':'妈','買':'买','來':'来','許':'许','盤':'盘','聰':'聪','哥':'哥','給':'给','裡':'里','裏':'里','說':'说','嗎':'吗','謝':'谢','對':'对','見':'见','關':'关','係':'系','貌':'貌','禮':'礼','語':'语','學':'学','習':'习','書':'书','筆':'笔','講':'讲','會':'会','還':'还','飯':'饭','餓':'饿','貓':'猫','間':'间','東':'东','麵':'面','蛋':'蛋','歡':'欢','兒':'儿','歌':'歌','漢':'汉','門':'门','開':'开','聽':'听','誰':'谁','訴':'诉','時':'时','嗎':'吗','爺':'爷','園':'园','鳥':'鸟','們':'们','這':'这','並':'并','體':'体','實':'实','發':'发'};
const ALIAS={'俐':'利力立丽例厉莉粒','梨':'离里理李黎犁璃丽','融':'荣容蓉溶熔绒','孔':'空恐控','伶':'灵玲铃零龄凌','聪':'葱从匆','盘':'盆判攀','主':'住注祝煮助','意':'义亿以艺议易','岁':'睡碎随','弟':'地第帝的','让':'嚷','叫':'较教觉','留':'流刘六','己':'几挤给机','把':'吧爸巴','只':'之知支直','吃':'持迟池','着':'这者著','突':'图涂','然':'燃','许':'需须','多':'都','来':'莱','分':'份粉','看':'砍','中':'钟终','有':'又右友','了':'啦乐','个':'各','四':'4是','小':'晓笑','名':'明鸣','明':'名鸣','心':'新欣','大':'达打','哥':'歌','给':'几','自':'子字','妈':'吗马','买':'卖迈','说':'所','的':'得地'};
const DIG={'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'};
const zhNorm=s=>[...s.replace(ZP,'')].map(c=>TRAD[c]||DIG[c]||c);
const zhEq=(c,x)=>x===c||(ALIAS[c]||'').includes(x);
function scoreZh(t,h){const T=[...t.replace(ZP,'')],H=zhNorm(h),used=new Set();return T.map(c=>{const k=H.findIndex((x,i)=>!used.has(i)&&zhEq(c,x));if(k>=0){used.add(k);return true}return false})}
const scoreQ=(q,h)=>q.slang==='zh'?scoreZh(q.speak,h):score(q.speak,h);
function score(t,h){const T=norm(t),H=norm(h),used=new Set();return T.map(w=>{const k=H.findIndex((x,i)=>!used.has(i)&&(x===w||(w.length>=4&&lev(w,x)<=1)||(w==='wuzzy'&&/^(wuzz|wuss|woozy|wusy|was|whoozy)/.test(x))||(w==='fuzzy'&&/^(fuzz|fuss|fussy|fozzy)/.test(x))));if(k>=0){used.add(k);return true}return false})}
function speakHTML(q){const zh=q.slang==='zh',L=zh?'zh':'en',words=zh?[...q.speak.replace(ZP,'')]:q.speak.split(/\s+/);return `<div class="target ${zh?'zht':''}" ${zh?'lang="zh"':''}>${words.map(w=>`<span class="tw">${w}</span>`).join(zh?'':' ')}</div>${q.py?`<p class="py">${q.py}</p>`:''}
  <div class="lis"><button class="spk" data-say="${esc(q.speak)}" data-lang="${L}">🔊 Dengar</button><button class="spk" data-say="${esc(q.speak)}" data-lang="${L}" data-slow="1">🐢 Pelan</button></div>
  ${DICT&&!Q.noMic?`<button class="micbtn" id="mic">🎤<span>Ketuk lalu bicara</span></button><p class="heard" id="heard"></p>`:`<div class="self"><p>🗣️ Ucapkan kalimat di atas 3 kali dengan jelas dan lantang. Mama/Papa mendengarkan.</p><button class="btn" id="said">${q.bab==='cerita'||Q.k==='conv'?'Mama/Papa: sudah benar ✓':'Sudah lancar ✓'}</button></div>`}`}
function updHeard(){if(Q&&Q.fmode){const el=document.getElementById('fheard');const txt=(SP.heard+' '+SP.live).trim();if(el&&txt)el.textContent='Terdengar: “'+txt+'”';return}const pq=Q&&Q.list[Q.i];if(pq&&pq.poem){const el=document.getElementById('ph'+Q.pline);const txt=(SP.heard+' '+SP.live).trim();if(el&&txt)el.textContent='Terdengar: “'+txt+'”';return}const h=document.getElementById('heard');if(!h)return;const txt=(SP.heard+' '+SP.live).trim();h.textContent=txt?'Terdengar: “'+txt+'”':'';const sc=scoreQ(Q.list[Q.i],txt);document.querySelectorAll('.tw').forEach((e,i)=>e.classList.toggle('hit',!!sc[i]))}
function judge(){const q=Q.list[Q.i],sc=scoreQ(q,SP.heard),r=sc.filter(Boolean).length/sc.length,need=q.bab==='cerita'?.85:q.slang==='zh'?.7:.8;document.querySelectorAll('.tw').forEach((e,i)=>{e.classList.toggle('hit',sc[i]);e.classList.toggle('miss',!sc[i])});

function initType(q){let i=0,err=0;const tt=document.getElementById('tt'),inp=document.getElementById('tin'),st=document.getElementById('tstat');
  const show=()=>{tt.textContent=q.type[i];st.textContent=`Baris ${i+1} dari ${q.type.length}`;inp.value=''};show();
